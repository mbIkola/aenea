[project]
name = "aenea-telegram-agent"
version = "0.1.0"
description = "Aenea Telegram user-client application"
requires-python = ">=3.13"
dependencies = ["aenea-contracts", "aenea-agents", "telethon>=1.46,<2"]

[project.scripts]
aenea-telegram = "aenea_telegram.cli:main"

[tool.uv.sources]
aenea-contracts = { workspace = true }
aenea-agents = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aenea_telegram"]
