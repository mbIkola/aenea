[project]
name = "aenea-raidsl"
version = "0.1.0"
description = "RaidSL agent, catalogue ports and bounded model runner for Aenea"
requires-python = ">=3.13"
dependencies = ["aenea-contracts", "aenea-agents", "openai-agents==0.26.0", "openai>=3.59,<4", "pydantic>=2.14,<3", "jsonschema>=4.26,<5"]

[project.scripts]
aenea-raidsl = "aenea_raidsl.cli:main"

[tool.uv.sources]
aenea-contracts = { workspace = true }
aenea-agents = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aenea_raidsl"]
