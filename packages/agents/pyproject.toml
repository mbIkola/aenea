[project]
name = "aenea-agents"
version = "0.1.0"
description = "Transport-independent Aenea agent registration and routing"
requires-python = ">=3.13"
dependencies = ["aenea-contracts"]

[tool.uv.sources]
aenea-contracts = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aenea_agents"]
